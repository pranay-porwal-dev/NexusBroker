<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test Client</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #00ff00; padding: 20px; }
        #log { white-space: pre-wrap; margin-top: 20px; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>NexusBroker WS Terminal</h2>
    
    <button onclick="connect()">1. Connect</button>
    <button onclick="subscribe('RELIANCE')">2. Subscribe RELIANCE</button>
    <button onclick="subscribe('HDFC')">3. Subscribe HDFC</button>
    <button onclick="disconnect()">4. Disconnect</button>

    <div id="log"></div>

    <script>
        let ws;
        const logEl = document.getElementById('log');

        function log(msg) {
            logEl.innerHTML += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        }

        function connect() {
            // Note the ws:// protocol instead of http://
            ws = new WebSocket('ws://localhost:3000');

            ws.onopen = () => log('TCP Socket Opened. Waiting for welcome message...');
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log(`Server says: ${JSON.stringify(data, null, 2)}`);
            };

            ws.onclose = () => log('Connection fully closed.');
        }

        function subscribe(symbol) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return log('Error: Not connected');
            
            const msg = { type: 'subscribe', symbol: symbol };
            ws.send(JSON.stringify(msg));
            log(`Sent: ${JSON.stringify(msg)}`);
        }

        function disconnect() {
            if (ws) ws.close();
        }
    </script>
</body>
</html>
